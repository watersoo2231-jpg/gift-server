<!-- 선물하기 버튼 -->
<button type="button" id="gift-btn" style="width:100%; background:#ff5722; color:#fff; border:none; padding:15px; font-size:16px; border-radius:8px; cursor:pointer; margin-top:10px;">🎁 선물하기</button>

<!-- 팝업 -->
<div id="gift-popup" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; display:flex; align-items:center; justify-content:center;">
  <div style="background:#fff; padding:30px; border-radius:12px; width:90%; max-width:400px;">
    <h3 style="text-align:center; margin-bottom:20px;">선물 받는 분 정보</h3>
    <input type="text" id="gift-recipient-email" placeholder="받는 분 이메일" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; margin-bottom:12px;">
    <button id="send-gift-btn" style="width:100%; background:#222; color:#fff; border:none; padding:14px; font-size:16px; border-radius:8px; cursor:pointer;">선물 보내기</button>
  </div>
</div>

<script>
document.getElementById("gift-btn").addEventListener("click", function() {
  document.getElementById("gift-popup").style.display = "flex";
});

document.getElementById("send-gift-btn").addEventListener("click", async function() {
  const recipientEmail = document.getElementById("gift-recipient-email").value.trim();
  if (!recipientEmail) {
    alert("받는 분의 이메일을 입력해주세요.");
    return;
  }

  // 상품 정보 가져오기 (쇼핑몰에 맞게 수정 필요)
  const product_id = "P001"; // 예시 상품 ID
  const amount = 50000; // 예시 상품 가격

  const response = await fetch("https://gift-server-production-3f51.up.railway.app/api/gift", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ recipient_email: recipientEmail, product_id: product_id, amount: amount })
  });

  const result = await response.json();
  if (result.success) {
    alert(`선물 보내기 성공! 선물 ID: ${result.gift_id}`);
    document.getElementById("gift-popup").style.display = "none";
    // 이후 결제 페이지로 이동하는 로직 추가
  } else {
    alert("선물 보내기 실패: " + (result.details || "알 수 없는 오류"));
  }
});
</script>
